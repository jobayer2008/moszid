<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মসজিদ ব্যবস্থাপনা</title>
<style>
:root{--pri:#0e6b4f;--pri-d:#094d38;--acc:#c99a2e;--bg:#f3f6f4;--card:#ffffff;--txt:#1f2d27;--muted:#5f6f68;--danger:#b3412e;--border:#e0e6e2;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","SolaimanLipi",sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:1.25rem}
header .sub{font-size:.8rem;opacity:.85}
nav{display:flex;gap:6px;background:var(--pri-d);padding:6px 10px;overflow-x:auto}
nav button{background:transparent;border:none;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;white-space:nowrap}
nav button.active{background:rgba(255,255,255,.2);font-weight:700}
main{padding:16px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--pri-d)}
.stat span{color:var(--muted);font-size:.85rem}
h2{color:var(--pri-d);font-size:1.1rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
th:first-child,td:first-child{text-align:right}
thead th{background:#eef4f1;color:var(--pri-d)}
tr:last-child td{border-bottom:none}
.btn{background:var(--pri);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:.9rem}
.btn.acc{background:var(--acc)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:transparent;color:var(--pri-d);border:1px solid var(--pri)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.row .field{flex:1;min-width:140px;margin-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.75rem;background:#eef4f1;color:var(--pri-d)}
.tag.due{background:#fbeae7;color:var(--danger)}
.tag.paid{background:#e7f4ec;color:var(--pri-d)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin-top:0;color:var(--pri-d)}
.close{float:left;cursor:pointer;font-size:1.3rem;color:var(--muted);background:none;border:none}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs2 button{background:#eef4f1;border:1px solid var(--border);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.85rem}
.tabs2 button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.notice{background:#fff8e8;border:1px solid #f0dca0;border-radius:10px;padding:12px;color:#6b5410}
.mini{font-size:.8rem;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.empty{text-align:center;color:var(--muted);padding:20px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#c8d3ce;border-radius:4px}
@media print{header,nav,.no-print{display:none!important}main{padding:0}.card{border:none;box-shadow:none}}
</style>
</head>
<body>
<header>
  <div><h1>🕌 <span id="hMosqueName">মসজিদ ব্যবস্থাপনা</span></h1><div class="sub" id="hAddr"></div></div>
  <div class="sub" id="hDate"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* ---------- Bengali helpers ---------- */
const bnDigits=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function toBn(n){return String(n).replace(/[0-9]/g,d=>bnDigits[d]);}
function taka(n){n=Math.round(Number(n)||0);let s=n.toString();let neg=s[0]==='-';if(neg)s=s.slice(1);
  let last3=s.length>3?s.slice(-3):s;let rest=s.length>3?s.slice(0,-3):'';
  if(rest)rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  let out=(rest?rest+',':'')+last3;return (neg?'-':'')+'৳'+toBn(out);}
function todayBn(){const d=new Date();return toBn(d.getDate())+' '+MONTHS[d.getMonth()]+' '+toBn(d.getFullYear());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- Data / storage ---------- */
const KEY='mosque_app_data_v1';
const DEFAULTS={
  info:{mosqueName:"বাইতুল আমান জামে মসজিদ",address:"রোড ৪, ব্লক সি, মিরপুর, ঢাকা-১২১৬",imamName:"হাফেজ মাওলানা আব্দুল্লাহ আল মামুন",khatibName:"মুফতি ড. সাইফুল ইসলাম",presidentName:"আলহাজ্ব মো. রফিকুল ইসলাম",secretaryName:"প্রকৌশলী তানভীর আহমেদ",treasurerName:"মো. জাহিদ হাসান",phone:"০১৭১১-২৩৪৫৬৭",estYear:"১৯৯৮ খ্রিস্টাব্দ",noticeText:"প্রতি শুক্রবার বাদ মাগরিব পবিত্র কুরআন তাফসীর ও দোয়া মাহফিল অনুষ্ঠিত হয়। সকল মুসল্লিদের অংশগ্রহণের জন্য বিশেষভাবে অনুরোধ করা হলো।"},
  members:[
    {id:'m1',code:'M-101',name:'আলহাজ্ব মো. রফিকুল ইসলাম',phone:'০১৭১১-২৩৪৫৬৭',address:'বাড়ি ১২, রোড ৪, ব্লক সি',role:'সভাপতি',commitment:2000,joinDate:'০১ জানুয়ারি ২০২২',active:true},
    {id:'m2',code:'M-102',name:'প্রকৌশলী তানভীর আহমেদ',phone:'০১৮১৯-৮৭৬৫৪৩',address:'বাড়ি ১৮, রোড ৫, ব্লক সি',role:'সাধারণ সম্পাদক',commitment:1500,joinDate:'১৫ জানুয়ারি ২০২২',active:true},
    {id:'m3',code:'M-103',name:'মো. জাহিদ হাসান',phone:'০১৯১২-৩৪৫৬৭৮',address:'বাড়ি ৭, রোড ২, ব্লক সি',role:'কোষাধ্যক্ষ',commitment:1000,joinDate:'০১ ফেব্রুয়ারি ২০২২',active:true},
    {id:'m4',code:'M-104',name:'ডা. মাহমুদুর রহমান',phone:'০১৭১৫-৯৯৮৮৭৭',address:'বাড়ি ২৪, রোড ৩, ব্লক সি',role:'আজীবন সদস্য',commitment:1500,joinDate:'১০ মার্চ ২০২৩',active:true},
    {id:'m5',code:'M-105',name:'আলহাজ্ব আব্দুল করিম',phone:'০১৬৭৬-৫৪৩২১০',address:'বাড়ি ৩১, রোড ৬, ব্লক বি',role:'কার্যকরী সদস্য',commitment:1000,joinDate:'০৫ মে ২০২৩',active:true},
    {id:'m6',code:'M-106',name:'মো. কামরুল হাসান',phone:'০১৫৫২-১১২২৩৩',address:'বাড়ি ৯, রোড ১, ব্লক সি',role:'সাধারণ মুসল্লি',commitment:500,joinDate:'১২ জুন ২০২৩',active:true},
    {id:'m7',code:'M-107',name:'মো. শফিকুল আলম',phone:'০১৭২২-৪৪৫৫৬৬',address:'বাড়ি ১৫, রোড ৪, ব্লক সি',role:'সাধারণ মুসল্লি',commitment:500,joinDate:'২০ আগস্ট ২০২৩',active:true},
    {id:'m8',code:'M-108',name:'ব্যারিস্টার নাজমুল হুদা',phone:'০১৮৩৩-৭৭৮৮৯৯',address:'বাড়ি ৪২, রোড ৭, ব্লক ডি',role:'আজীবন সদস্য',commitment:2000,joinDate:'০১ জানুয়ারি ২০২৪',active:true}
  ],
  subs:[],
  prayers:[
    {key:'FAJR',name:'ফজর',azan:'ভোর ৪:৪৫',jamaat:'ভোর ৫:১৫',rakat:'সুন্নত ২, ফরজ ২ (মোট ৪ রাকাত)',jummah:false},
    {key:'DHUHR',name:'যোহর',azan:'দুপুর ১২:৪৫',jamaat:'দুপুর ১:১৫',rakat:'সুন্নত ৪, ফরজ ৪, সুন্নত ২ (মোট ১০ রাকাত)',jummah:false},
    {key:'ASR',name:'আসর',azan:'বিকাল ৪:১৫',jamaat:'বিকাল ৪:৩০',rakat:'সুন্নত ৪, ফরজ ৪ (মোট ৮ রাকাত)',jummah:false},
    {key:'MAGHRIB',name:'মাগরিব',azan:'সন্ধ্যা ৬:০৪',jamaat:'সন্ধ্যা ৬:১০',rakat:'ফরজ ৩, সুন্নত ২ (মোট ৫ রাকাত)',jummah:false},
    {key:'ISHA',name:'এশা',azan:'রাত ৭:৪৫',jamaat:'রাত ৮:১৫',rakat:'ফরজ ৪, সুন্নত ২, বিতর ৩ (মোট ৯ রাকাত)',jummah:false},
    {key:'JUMMAH',name:'পবিত্র জুম্মা',azan:'দুপুর ১২:৩০',jamaat:'দুপুর ১:৩০',rakat:'খুতবা দুপুর ১:০৫, ফরজ ২ রাকাত ও সুন্নত',jummah:true}
  ],
  donations:[],expenses:[]
};
const DON_CATS=["জুমার দানবাক্স","মসজিদ উন্নয়ন তহবিল","এতিমখানা ও মাদ্রাসা","মাহফিল ও ধর্মীয় অনুষ্ঠান","যাকাত ও সদকা","সাধারণ অনুদান"];
const EXP_CATS=["ইমাম ও মুয়াজ্জিন হাদিয়া","বিদ্যুৎ ও পানি বিল","মসজিদ সংস্কার ও উন্নয়ন","সাউন্ড সিস্টেম ও আসবাবপত্র","পরিষ্কার-পরিচ্ছন্নতা ও বিবিধ"];
const PAY_METHODS=["নগদ","বিকাশ","নগদ (এমএফএস)","ব্যাংক"];
const ROLES=["সভাপতি","সাধারণ সম্পাদক","কোষাধ্যক্ষ","কার্যকরী সদস্য","আজীবন সদস্য","সাধারণ মুসল্লি"];

let DB=load();
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
const now=new Date();let CUR_YEAR=now.getFullYear();

/* seed a couple of demo subscriptions once so dashboard isn't empty */
if(DB.subs.length===0 && !DB._seeded){
  const cm=now.getMonth()+1, y=now.getFullYear();
  DB.members.slice(0,6).forEach((m,i)=>{
    DB.subs.push({id:uid(),memberId:m.id,memberName:m.name,month:cm,year:y,amount:m.commitment,date:todayBn(),method:PAY_METHODS[i%4],receipt:'R-'+toBn(1000+i),notes:''});
  });
  DB._seeded=true; save();
}

/* ---------- Router ---------- */
const TABS=[['dashboard','ড্যাশবোর্ড'],['members','সদস্য ও চাঁদা'],['prayer','নামাজের সময়সূচী'],['finance','দান ও ব্যয়'],['audit','অডিট রিপোর্ট']];
let currentTab='dashboard';
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===currentTab?'active':''}" onclick="goTab('${t[0]}')">${t[1]}</button>`).join('');
}
function goTab(t){currentTab=t;renderNav();renderApp();}
function renderHeader(){
  document.getElementById('hMosqueName').textContent=DB.info.mosqueName;
  document.getElementById('hAddr').textContent=DB.info.address;
  document.getElementById('hDate').textContent='আজ: '+todayBn();
}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.add('open');}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  const y=CUR_YEAR,m=now.getMonth()+1;
  const activeMembers=DB.members.filter(x=>x.active);
  const paidIds=new Set(DB.subs.filter(s=>s.year===y&&s.month===m).map(s=>s.memberId));
  const dueMembers=activeMembers.filter(x=>!paidIds.has(x.id));
  const yearSubs=DB.subs.filter(s=>s.year===y).reduce((a,b)=>a+b.amount,0);
  const yearDon=DB.donations.filter(d=>d.year===y).reduce((a,b)=>a+b.amount,0);
  const yearExp=DB.expenses.filter(e=>e.year===y).reduce((a,b)=>a+b.amount,0);
  const balance=yearSubs+yearDon-yearExp;
  return `
  <div class="grid g4">
    <div class="stat"><b>${toBn(activeMembers.length)}</b><span>সক্রিয় সদস্য</span></div>
    <div class="stat"><b style="color:var(--danger)">${toBn(dueMembers.length)}</b><span>এই মাসে চাঁদা বকেয়া</span></div>
    <div class="stat"><b>${taka(yearSubs+yearDon)}</b><span>${toBn(y)} সালের মোট আয়</span></div>
    <div class="stat"><b style="color:${balance>=0?'var(--pri-d)':'var(--danger)'}">${taka(balance)}</b><span>বর্তমান স্থিতি</span></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h2>নামাজের সময় (আজ)</h2>
      <table><tbody>${DB.prayers.map(p=>`<tr><td style="text-align:right">${p.name}</td><td>আজান: ${p.azan}</td><td>জামাত: ${p.jamaat}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <h2>বিজ্ঞপ্তি</h2>
      <div class="notice">${DB.info.noticeText}</div>
      <p class="mini" style="margin-top:10px">ইমাম: ${DB.info.imamName}<br>খতিব: ${DB.info.khatibName}</p>
    </div>
  </div>
  <div class="card">
    <div class="section-head"><h2 style="margin:0">এই মাসে চাঁদা বকেয়া সদস্য</h2></div>
    ${dueMembers.length? `<table><thead><tr><th>নাম</th><th>পদবি</th><th>মাসিক চাঁদা</th></tr></thead><tbody>
      ${dueMembers.map(x=>`<tr><td>${x.name}</td><td>${x.role}</td><td>${taka(x.commitment)}</td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">সকল সদস্যের চাঁদা পরিশোধিত ✅</div>'}
  </div>`;
}

/* ---------- MEMBERS & SUBSCRIPTIONS ---------- */
let memberSubTab='members';
function viewMembers(){
  return `
  <div class="tabs2">
    <button class="${memberSubTab==='members'?'active':''}" onclick="setMemberSubTab('members')">সদস্য তালিকা</button>
    <button class="${memberSubTab==='subs'?'active':''}" onclick="setMemberSubTab('subs')">চাঁদা আদায়</button>
  </div>
  ${memberSubTab==='members'?memberListView():subsView()}`;
}
function setMemberSubTab(t){memberSubTab=t;renderApp();}
function memberListView(){
  return `
  <div class="card">
    <div class="section-head"><h2 style="margin:0">সদস্য তালিকা (${toBn(DB.members.length)})</h2><button class="btn" onclick="openMemberForm()">+ নতুন সদস্য</button></div>
    <table><thead><tr><th>কোড</th><th>নাম</th><th>পদবি</th><th>ফোন</th><th>মাসিক চাঁদা</th><th>অবস্থা</th><th>কার্যক্রম</th></tr></thead>
    <tbody>${DB.members.map(mm=>`<tr>
      <td>${mm.code}</td><td>${mm.name}</td><td>${mm.role}</td><td>${mm.phone}</td><td>${taka(mm.commitment)}</td>
      <td><span class="tag ${mm.active?'paid':'due'}">${mm.active?'সক্রিয়':'নিষ্ক্রিয়'}</span></td>
      <td><button class="btn ghost" style="padding:4px 8px" onclick="openMemberForm('${mm.id}')">সম্পাদনা</button>
      <button class="btn danger" style="padding:4px 8px" onclick="deleteMember('${mm.id}')">মুছুন</button></td>
    </tr>`).join('')||`<tr><td colspan="7" class="empty">কোনো সদস্য নেই</td></tr>`}</tbody></table>
  </div>`;
}
function openMemberForm(id){
  const mm=id?DB.members.find(x=>x.id===id):null;
  modal(`<button class="close" onclick="closeModal()">×</button><h3>${mm?'সদস্য সম্পাদনা':'নতুন সদস্য যোগ'}</h3>
  <div class="field"><label>সদস্য কোড</label><input id="f_code" value="${mm?mm.code:'M-'+toBn(100+DB.members.length+1)}"></div>
  <div class="field"><label>নাম</label><input id="f_name" value="${mm?mm.name:''}"></div>
  <div class="field"><label>ফোন</label><input id="f_phone" value="${mm?mm.phone:''}"></div>

/* ---------- AUDIT REPORT ---------- */
function viewAudit(){
  const y=CUR_YEAR;
  const yearSubs=DB.subs.filter(s=>s.year===y);
  const yearDon=DB.donations.filter(d=>d.year===y);
  const yearExp=DB.expenses.filter(e=>e.year===y);
  const totalSub=yearSubs.reduce((a,b)=>a+b.amount,0);
  const totalDon=yearDon.reduce((a,b)=>a+b.amount,0);
  const totalIncome=totalSub+totalDon;
  const totalExpense=yearExp.reduce((a,b)=>a+b.amount,0);
  const net=totalIncome-totalExpense;
  const monthRows=MONTHS.map((mn,i)=>{const sum=yearSubs.filter(s=>s.month===i+1).reduce((a,b)=>a+b.amount,0);return `<tr><td>${mn}</td><td>${taka(sum)}</td></tr>`;}).join('');
  const donCatRows=DON_CATS.map(c=>{const sum=yearDon.filter(d=>d.category===c).reduce((a,b)=>a+b.amount,0);return `<tr><td>${c}</td><td>${taka(sum)}</td></tr>`;}).join('');
  const expCatRows=EXP_CATS.map(c=>{const sum=yearExp.filter(e=>e.category===c).reduce((a,b)=>a+b.amount,0);return `<tr><td>${c}</td><td>${taka(sum)}</td></tr>`;}).join('');
  return `
  <div class="card no-print"><div class="row"><div class="field" style="max-width:160px"><label>বছর নির্বাচন</label><input type="number" value="${y}" onchange="changeYear(this.value)"></div>
  <button class="btn" onclick="printAuditReport()">🖨️ বার্ষিক রিপোর্ট প্রিন্ট</button>
  <button class="btn acc" onclick="printMonthlyStatements()">🖨️ মাসিক হিসাব প্রিন্ট (A4 অর্ধেক পেজে)</button></div></div>
  <div id="auditPrintArea">
  <div class="card">
    <h2>বার্ষিক অডিট রিপোর্ট — ${toBn(y)}</h2>
    <p class="mini">${DB.info.mosqueName} | ${DB.info.address}</p>
    <div class="grid g4">
      <div class="stat"><b>${taka(totalSub)}</b><span>মাসিক চাঁদা আয়</span></div>
      <div class="stat"><b>${taka(totalDon)}</b><span>অনুদান আয়</span></div>
      <div class="stat"><b>${taka(totalExpense)}</b><span>মোট ব্যয়</span></div>
      <div class="stat"><b style="color:${net>=0?'var(--pri-d)':'var(--danger)'}">${taka(net)}</b><span>নিট উদ্বৃত্ত</span></div>
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>মাসভিত্তিক চাঁদা আদায়</h2><table><thead><tr><th>মাস</th><th>পরিমাণ</th></tr></thead><tbody>${monthRows}</tbody></table></div>
    <div class="card"><h2>খাতভিত্তিক অনুদান</h2><table><thead><tr><th>খাত</th><th>পরিমাণ</th></tr></thead><tbody>${donCatRows}</tbody></table></div>
  </div>
  <div class="card"><h2>খাতভিত্তিক ব্যয়</h2><table><thead><tr><th>খাত</th><th>পরিমাণ</th></tr></thead><tbody>${expCatRows}
    <tr style="font-weight:700"><td>মোট ব্যয়</td><td>${taka(totalExpense)}</td></tr></tbody></table></div>
  <div class="card">
    <h2>সারসংক্ষেপ</h2>
    <table><tbody>
      <tr><td>মোট আয় (চাঁদা + অনুদান)</td><td style="font-weight:700">${taka(totalIncome)}</td></tr>
      <tr><td>মোট ব্যয়</td><td style="color:var(--danger)">(-) ${taka(totalExpense)}</td></tr>
      <tr style="font-weight:700"><td>নিট উদ্বৃত্ত</td><td>${taka(net)}</td></tr>
    </tbody></table>
    <div class="grid g4" style="margin-top:24px">
      <div class="mini" style="text-align:center;border-top:1px solid var(--border);padding-top:6px">${DB.info.presidentName}<br>সভাপতি</div>
      <div class="mini" style="text-align:center;border-top:1px solid var(--border);padding-top:6px">${DB.info.secretaryName}<br>সাধারণ সম্পাদক</div>
      <div class="mini" style="text-align:center;border-top:1px solid var(--border);padding-top:6px">${DB.info.treasurerName}<br>কোষাধ্যক্ষ</div>
      <div class="mini" style="text-align:center;border-top:1px solid var(--border);padding-top:6px">নিরীক্ষক</div>
    </div>
  </div>
  </div>`;
}

    h3{color:#094d38;font-size:.95rem;margin:8px 0 4px}
    .card{border:1px solid #e0e6e2;border-radius:10px;padding:14px;margin-bottom:14px}
    .grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
    .stat{border:1px solid #e0e6e2;border-radius:10px;padding:10px;text-align:center}
    .stat b{display:block;font-size:1.2rem;color:#094d38}.stat span{color:#5f6f68;font-size:.8rem}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th,td{padding:5px 7px;border-bottom:1px solid #e0e6e2;text-align:right}
    thead th{background:#eef4f1;color:#094d38}.mini{font-size:.78rem;color:#5f6f68}
    @media print{@page{margin:10mm}}
    @media (max-width:480px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
    ${extraStyles||''}
  </style>`;
  const old=document.getElementById('printFrame');
  if(old)old.remove();
  const iframe=document.createElement('iframe');
  iframe.id='printFrame';
  iframe.style.position='fixed';
  iframe.style.right='0';iframe.style.bottom='0';
  iframe.style.width='0';iframe.style.height='0';
  iframe.style.border='0';
  document.body.appendChild(iframe);
  const doc=iframe.contentWindow.document;
  doc.open();
  doc.write('<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>'+title+'</title>'+styles+'</head><body>'+bodyHtml+'</body></html>');
  doc.close();
  function doPrint(){
    try{iframe.contentWindow.focus();iframe.contentWindow.print();}
    catch(e){alert('এই ব্রাউজারে সরাসরি প্রিন্ট করা যায়নি। অনুগ্রহ করে ব্রাউজারের মেনু থেকে "শেয়ার/প্রিন্ট" অপশন ব্যবহার করুন।');}
  }
  if(iframe.contentWindow.document.readyState==='complete'){setTimeout(doPrint,150);}
  else{iframe.onload=function(){setTimeout(doPrint,150);};}
}
function printAuditReport(){
  const content=document.getElementById('auditPrintArea');
  if(!content){alert('প্রিন্ট করার মতো কোনো তথ্য পাওয়া যায়নি।');return;}
  printViaIframe('বার্ষিক অডিট রিপোর্ট',content.innerHTML,'');
}
function printMonthlyStatements(){
  const y=CUR_YEAR;
  const blocks=MONTHS.map((mn,i)=>{
    const mi=i+1;
    const subs=DB.subs.filter(s=>s.year===y&&s.month===mi);
    const dons=DB.donations.filter(d=>d.year===y&&d.monthIndex===mi);
    const exps=DB.expenses.filter(e=>e.year===y&&e.monthIndex===mi);
    const totalSub=subs.reduce((a,b)=>a+b.amount,0);
    const totalDon=dons.reduce((a,b)=>a+b.amount,0);
    const totalExp=exps.reduce((a,b)=>a+b.amount,0);
    const net=totalSub+totalDon-totalExp;
    const subRows=subs.map(s=>`<tr><td>${s.memberName}</td><td>${taka(s.amount)}</td><td>${s.method}</td></tr>`).join('')||`<tr><td colspan="3" class="mini">কোনো চাঁদা আদায় হয়নি</td></tr>`;
    const donRows=dons.map(d=>`<tr><td>${d.donorName||'নাম উল্লেখ নেই'}</td><td>${d.category}</td><td>${taka(d.amount)}</td></tr>`).join('')||`<tr><td colspan="3" class="mini">কোনো অনুদান নেই</td></tr>`;
    const expRows=exps.map(e=>`<tr><td>${e.title}</td><td>${e.category}</td><td>${taka(e.amount)}</td></tr>`).join('')||`<tr><td colspan="3" class="mini">কোনো ব্যয় নেই</td></tr>`;
    return `<div class="month-block">
      <div class="mb-head">
        <div><b>${DB.info.mosqueName}</b><br><span class="mini">${DB.info.address}</span></div>
        <div style="text-align:left"><b>মাসিক আর্থিক হিসাব</b><br><span class="mini">${mn}, ${toBn(y)}</span></div>
      </div>
      <div class="mb-cols">
        <div>
          <h3>চাঁদা আদায় (মোট ${taka(totalSub)})</h3>
          <table><tbody>${subRows}</tbody></table>
        </div>
        <div>
          <h3>অনুদান (মোট ${taka(totalDon)})</h3>
          <table><tbody>${donRows}</tbody></table>
          <h3>ব্যয় (মোট ${taka(totalExp)})</h3>
          <table><tbody>${expRows}</tbody></table>
        </div>
      </div>
      <div class="mb-net">নিট (চাঁদা+অনুদান-ব্যয়): <b>${taka(net)}</b></div>
    </div>`;
  }).join('');
  const extraStyles=`
    body{margin:0}
    .month-block{
      width:100%;height:148.5mm;padding:8mm 10mm;
      border-bottom:1px dashed #999;box-sizing:border-box;
      overflow:hidden;page-break-inside:avoid;
      display:flex;flex-direction:column;
    }
    .month-block:nth-child(2n){page-break-after:always}
    .mb-head{display:flex;justify-content:space-between;border-bottom:2px solid #094d38;padding-bottom:6px;margin-bottom:8px}
    .mb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;overflow:hidden}
    .mb-cols table{font-size:.78rem}
    .mb-cols th,.mb-cols td{padding:3px 5px}
    .mb-net{margin-top:6px;padding-top:6px;border-top:1px solid #e0e6e2;text-align:left;font-size:.9rem}
    @media print{.month-block{border-bottom:none}}
  `;
  printViaIframe('মাসিক আর্থিক হিসাব — '+toBn(y),blocks,extraStyles);
}
