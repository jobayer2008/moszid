<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মসজিদ ব্যবস্থাপনা</title>
<style>
:root{--pri:#0e6b4f;--pri-d:#094d38;--acc:#c99a2e;--bg:#f0f5f2;--card:#ffffff;--txt:#1f2d27;--muted:#5f6f68;--danger:#b3412e;--border:#e0e6e2;--shadow:0 2px 10px rgba(9,77,56,.07);}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","SolaimanLipi",sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(120deg,var(--pri),var(--pri-d) 70%);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:3px solid var(--acc)}
header h1{margin:0;font-size:1.25rem}
header .sub{font-size:.8rem;opacity:.85}
nav{display:flex;gap:6px;background:var(--pri-d);padding:8px 10px;overflow-x:auto}
nav button{background:transparent;border:none;color:#fff;opacity:.8;padding:9px 16px;border-radius:20px;cursor:pointer;font-size:.9rem;white-space:nowrap;transition:.15s}
nav button.active{background:var(--acc);color:#3a2c05;opacity:1;font-weight:700}
main{padding:16px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.35rem;color:var(--pri-d)}
.stat span{color:var(--muted);font-size:.85rem}
h2{color:var(--pri-d);font-size:1.1rem;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid #eef4f1}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
th:first-child,td:first-child{text-align:right}
thead th{background:#eef4f1;color:var(--pri-d)}
tr:last-child td{border-bottom:none}
.btn{background:var(--pri);color:#fff;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:.9rem;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn.acc{background:var(--acc)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:transparent;color:var(--pri-d);border:1px solid var(--pri)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.row .field{flex:1;min-width:140px;margin-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.75rem;background:#eef4f1;color:var(--pri-d)}
.tag.due{background:#fbeae7;color:var(--danger)}
.tag.paid{background:#e7f4ec;color:var(--pri-d)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin-top:0;color:var(--pri-d)}
.close{float:left;cursor:pointer;font-size:1.3rem;color:var(--muted);background:none;border:none}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs2 button{background:#eef4f1;border:1px solid var(--border);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.85rem}
.tabs2 button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.notice{background:#fff8e8;border:1px solid #f0dca0;border-radius:10px;padding:12px;color:#6b5410}
.mini{font-size:.8rem;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.empty{text-align:center;color:var(--muted);padding:20px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#c8d3ce;border-radius:4px}
.auth-wrap{max-width:420px;margin:40px auto}
@media print{header,nav,.no-print{display:none!important}main{padding:0}.card{border:none;box-shadow:none}}
</style>
</head>
<body>
<header>
  <div><h1>🕌 <span id="hMosqueName">মসজিদ ব্যবস্থাপনা</span></h1><div class="sub" id="hAddr"></div></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="sub" id="hDate"></div>
    <button id="logoutBtn" class="no-print" style="display:none;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem" onclick="doLogout()">লগআউট</button>
  </div>
</header>
<nav id="nav" style="display:none"></nav>
<main id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Bengali helpers ---------- */
const bnDigits=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function toBn(n){return String(n).replace(/[0-9]/g,d=>bnDigits[d]);}
function taka(n){n=Math.round(Number(n)||0);let s=n.toString();let neg=s[0]==='-';if(neg)s=s.slice(1);
  let last3=s.length>3?s.slice(-3):s;let rest=s.length>3?s.slice(0,-3):'';
  if(rest)rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  let out=(rest?rest+',':'')+last3;return (neg?'-':'')+'৳'+toBn(out);}
function todayBn(){const d=new Date();return toBn(d.getDate())+' '+MONTHS[d.getMonth()]+' '+toBn(d.getFullYear());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- Data / storage ---------- */
const KEY='mosque_app_data_v1';
const DEFAULTS={
  info:{mosqueName:"বাইতুল আমান জামে মসজিদ",address:"রোড ৪, ব্লক সি, মিরপুর, ঢাকা-১২১৬",imamName:"হাফেজ মাওলানা আব্দুল্লাহ আল মামুন",khatibName:"মুফতি ড. সাইফুল ইসলাম",presidentName:"আলহাজ্ব মো. রফিকুল ইসলাম",secretaryName:"প্রকৌশলী তানভীর আহমেদ",treasurerName:"মো. জাহিদ হাসান",phone:"০১৭১১-২৩৪৫৬৭",estYear:"১৯৯৮ খ্রিস্টাব্দ",noticeText:"প্রতি শুক্রবার বাদ মাগরিব পবিত্র কুরআন তাফসীর ও দোয়া মাহফিল অনুষ্ঠিত হয়। সকল মুসল্লিদের অংশগ্রহণের জন্য বিশেষভাবে অনুরোধ করা হলো।"},
  members:[
    {id:'m1',code:'M-101',name:'আলহাজ্ব মো. রফিকুল ইসলাম',phone:'০১৭১১-২৩৪৫৬৭',address:'বাড়ি ১২, রোড ৪, ব্লক সি',role:'সভাপতি',commitment:2000,joinDate:'০১ জানুয়ারি ২০২২',active:true},
    {id:'m2',code:'M-102',name:'প্রকৌশলী তানভীর আহমেদ',phone:'০১৮১৯-৮৭৬৫৪৩',address:'বাড়ি ১৮, রোড ৫, ব্লক সি',role:'সাধারণ সম্পাদক',commitment:1500,joinDate:'১৫ জানুয়ারি ২০২২',active:true},
    {id:'m3',code:'M-103',name:'মো. জাহিদ হাসান',phone:'০১৯১২-৩৪৫৬৭৮',address:'বাড়ি ৭, রোড ২, ব্লক সি',role:'কোষাধ্যক্ষ',commitment:1000,joinDate:'০১ ফেব্রুয়ারি ২০২২',active:true},
    {id:'m4',code:'M-104',name:'ডা. মাহমুদুর রহমান',phone:'০১৭১৫-৯৯৮৮৭৭',address:'বাড়ি ২৪, রোড ৩, ব্লক সি',role:'আজীবন সদস্য',commitment:1500,joinDate:'১০ মার্চ ২০২৩',active:true},
    {id:'m5',code:'M-105',name:'আলহাজ্ব আব্দুল করিম',phone:'০১৬৭৬-৫৪৩২১০',address:'বাড়ি ৩১, রোড ৬, ব্লক বি',role:'কার্যকরী সদস্য',commitment:1000,joinDate:'০৫ মে ২০২৩',active:true},
    {id:'m6',code:'M-106',name:'মো. কামরুল হাসান',phone:'০১৫৫২-১১২২৩৩',address:'বাড়ি ৯, রোড ১, ব্লক সি',role:'সাধারণ মুসল্লি',commitment:500,joinDate:'১২ জুন ২০২৩',active:true},
    {id:'m7',code:'M-107',name:'মো. শফিকুল আলম',phone:'০১৭২২-৪৪৫৫৬৬',address:'বাড়ি ১৫, রোড ৪, ব্লক সি',role:'সাধারণ মুসল্লি',commitment:500,joinDate:'২০ আগস্ট ২০২৩',active:true},
    {id:'m8',code:'M-108',name:'ব্যারিস্টার নাজমুল হুদা',phone:'০১৮৩৩-৭৭৮৮৯৯',address:'বাড়ি ৪২, রোড ৭, ব্লক ডি',role:'আজীবন সদস্য',commitment:2000,joinDate:'০১ জানুয়ারি ২০২৪',active:true}
  ],
  subs:[],
  prayers:[
    {key:'FAJR',name:'ফজর',azan:'ভোর ৪:৪৫',jamaat:'ভোর ৫:১৫',rakat:'সুন্নত ২, ফরজ ২ (মোট ৪ রাকাত)',jummah:false},
    {key:'DHUHR',name:'যোহর',azan:'দুপুর ১২:৪৫',jamaat:'দুপুর ১:১৫',rakat:'সুন্নত ৪, ফরজ ৪, সুন্নত ২ (মোট ১০ রাকাত)',jummah:false},
    {key:'ASR',name:'আসর',azan:'বিকাল ৪:১৫',jamaat:'বিকাল ৪:৩০',rakat:'সুন্নত ৪, ফরজ ৪ (মোট ৮ রাকাত)',jummah:false},
    {key:'MAGHRIB',name:'মাগরিব',azan:'সন্ধ্যা ৬:০৪',jamaat:'সন্ধ্যা ৬:১০',rakat:'ফরজ ৩, সুন্নত ২ (মোট ৫ রাকাত)',jummah:false},
    {key:'ISHA',name:'এশা',azan:'রাত ৭:৪৫',jamaat:'রাত ৮:১৫',rakat:'ফরজ ৪, সুন্নত ২, বিতর ৩ (মোট ৯ রাকাত)',jummah:false},
    {key:'JUMMAH',name:'পবিত্র জুম্মা',azan:'দুপুর ১২:৩০',jamaat:'দুপুর ১:৩০',rakat:'খুতবা দুপুর ১:০৫, ফরজ ২ রাকাত ও সুন্নত',jummah:true}
  ],
  donations:[],expenses:[]
};
const DON_CATS=["জুমার দানবাক্স","মসজিদ উন্নয়ন তহবিল","এতিমখানা ও মাদ্রাসা","মাহফিল ও ধর্মীয় অনুষ্ঠান","যাকাত ও সদকা","সাধারণ অনুদান"];
const EXP_CATS=["ইমাম ও মুয়াজ্জিন হাদিয়া","বিদ্যুৎ ও পানি বিল","মসজিদ সংস্কার ও উন্নয়ন","সাউন্ড সিস্টেম ও আসবাবপত্র","পরিষ্কার-পরিচ্ছন্নতা ও বিবিধ"];
const PAY_METHODS=["নগদ","বিকাশ","নগদ (এমএফএস)","ব্যাংক"];
const ROLES=["সভাপতি","সাধারণ সম্পাদক","কোষাধ্যক্ষ","কার্যকরী সদস্য","আজীবন সদস্য","সাধারণ মুসল্লি"];

let DB=null;
const now=new Date();let CUR_YEAR=now.getFullYear();

/* ---------- Supabase auth + storage (replaces localStorage) ---------- */
let sb=null, sbSession=null, saveTimer=null;
const SB_CFG_KEY='mosque_sb_cfg';
function getSbCfg(){try{return JSON.parse(localStorage.getItem(SB_CFG_KEY));}catch(e){return null;}}
function setSbCfg(url,key){try{localStorage.setItem(SB_CFG_KEY,JSON.stringify({url,key}));}catch(e){}}
function uidOwner(){return sbSession.user.id;}
const INFO_COLS={mosqueName:'mosque_name',address:'address',imamName:'imam_name',khatibName:'khatib_name',presidentName:'president_name',secretaryName:'secretary_name',treasurerName:'treasurer_name',phone:'phone',estYear:'est_year',noticeText:'notice_text'};
function infoRowToObj(r){const o={};for(const k in INFO_COLS)o[k]=r[INFO_COLS[k]]||'';return o;}
function memberRowToObj(r){return{id:r.id,code:r.code,name:r.name,phone:r.phone,address:r.address,role:r.role,commitment:Number(r.commitment)||0,joinDate:r.join_date,active:r.active};}
function subRowToObj(r){return{id:r.id,memberId:r.member_id,memberName:r.member_name,month:r.month,year:r.year,amount:Number(r.amount)||0,date:r.pay_date,method:r.method,receipt:r.receipt,notes:r.notes||''};}
function donRowToObj(r){return{id:r.id,donorName:r.donor_name,donorPhone:r.donor_phone,category:r.category,amount:Number(r.amount)||0,paymentMethod:r.payment_method,dateString:r.date_string,year:r.year,monthIndex:r.month_index,receiptNo:r.receipt_no,notes:r.notes||'',timestamp:Date.parse(r.created_at)||Date.now()};}
function expRowToObj(r){return{id:r.id,title:r.title,category:r.category,amount:Number(r.amount)||0,voucherNo:r.voucher_no,approvedBy:r.approved_by,dateString:r.date_string,year:r.year,monthIndex:r.month_index,notes:r.notes||'',timestamp:Date.parse(r.created_at)||Date.now()};}
function prayerRowToObj(r){return{key:r.key,name:r.name,azan:r.azan,jamaat:r.jamaat,rakat:r.rakat,jummah:r.jummah};}
async function boot(){
  const cfg=getSbCfg();
  if(!cfg){renderAuthScreen('register');return;}
  try{sb=window.supabase.createClient(cfg.url,cfg.key);}
  catch(e){renderAuthScreen('login','সংরক্ষিত Supabase তথ্য সঠিক নয়, আবার দিন।');return;}
  try{
    const{data,error}=await sb.auth.getSession();
    if(error||!data.session){renderAuthScreen('login');return;}
    sbSession=data.session;await afterLogin();
  }catch(e){renderAuthScreen('login');}
}
async function afterLogin(){
  document.getElementById('logoutBtn').style.display='';
  document.getElementById('nav').style.display='';
  const uid_=uidOwner();
  try{
    let[infoR,memR,pryR,subR,donR,expR]=await Promise.all([
      sb.from('mosque_info').select('*').eq('user_id',uid_).maybeSingle(),
      sb.from('members').select('*').eq('user_id',uid_).order('created_at'),
      sb.from('prayers').select('*').eq('user_id',uid_),
      sb.from('subscriptions').select('*').eq('user_id',uid_),
      sb.from('donations').select('*').eq('user_id',uid_).order('created_at',{ascending:false}),
      sb.from('expenses').select('*').eq('user_id',uid_).order('created_at',{ascending:false})
    ]);
    for(const r of[infoR,memR,pryR,subR,donR,expR])if(r.error)throw r.error;
    // প্রথমবার লগইনে মসজিদের তথ্য ও নামাজের সময় ডিফল্ট মান দিয়ে তৈরি করা হয়
    if(!infoR.data){
      const row={user_id:uid_};for(const k in INFO_COLS)row[INFO_COLS[k]]=DEFAULTS.info[k];
      const ins=await sb.from('mosque_info').insert(row).select().single();
      if(ins.error)throw ins.error;
      infoR={data:ins.data};
    }
    if(!pryR.data||pryR.data.length===0){
      const rows=DEFAULTS.prayers.map(p=>({user_id:uid_,key:p.key,name:p.name,azan:p.azan,jamaat:p.jamaat,rakat:p.rakat,jummah:p.jummah}));
      const ins=await sb.from('prayers').insert(rows).select();
      if(ins.error)throw ins.error;
      pryR={data:ins.data};
    }
    DB={
      info:infoRowToObj(infoR.data),
      members:(memR.data||[]).map(memberRowToObj),
      subs:(subR.data||[]).map(subRowToObj),
      prayers:(pryR.data||[]).map(prayerRowToObj).sort((a,b)=>DEFAULTS.prayers.findIndex(p=>p.key===a.key)-DEFAULTS.prayers.findIndex(p=>p.key===b.key)),
      donations:(donR.data||[]).map(donRowToObj),
      expenses:(expR.data||[]).map(expRowToObj)
    };
  }catch(e){
    alert('ডেটা লোড করতে সমস্যা হয়েছে। supabase-schema-full.sql চালানো হয়েছে কিনা এবং RLS পলিসি ঠিকমতো তৈরি হয়েছে কিনা যাচাই করুন।\n\n'+(e.message||e));
    DB=JSON.parse(JSON.stringify(DEFAULTS));DB.members=[];DB.subs=[];DB.donations=[];DB.expenses=[];
  }
  renderHeader();renderNav();renderApp();
}
function doLogout(){
  if(sb)sb.auth.signOut().catch(()=>{});
  sbSession=null;DB=null;
  document.getElementById('logoutBtn').style.display='none';
  renderAuthScreen('login');
}
function renderAuthScreen(mode,msg){
  const cfg=getSbCfg()||{url:'',key:''};
  document.getElementById('nav').style.display='none';
  document.getElementById('nav').innerHTML='';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('app').innerHTML=`
  <div class="card auth-wrap">
    <div class="tabs2">
      <button class="${mode==='register'?'active':''}" onclick="renderAuthScreen('register')">রেজিস্ট্রেশন</button>
      <button class="${mode==='login'?'active':''}" onclick="renderAuthScreen('login')">লগইন</button>
    </div>
    ${msg?`<div class="notice" style="margin-bottom:10px">${msg}</div>`:''}
    <div class="field"><label>Supabase Project URL</label><input id="a_url" value="${cfg.url||''}" placeholder="https://xxxx.supabase.co"></div>

async function submitRegister(){
  const name=val('a_name'),email=val('a_email'),pass=val('a_pass'),url=val('a_url').trim(),key=val('a_key').trim();
  if(!name||!email||!pass||!url||!key){alert('সব ঘর পূরণ করুন');return;}
  setSbCfg(url,key);
  try{sb=window.supabase.createClient(url,key);}
  catch(e){renderAuthScreen('register','Supabase URL/Key সঠিক নয়।');return;}
  try{
    const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
    if(error)throw error;
    if(data.session){sbSession=data.session;await afterLogin();}
    else{renderAuthScreen('login','রেজিস্ট্রেশন সফল হয়েছে। ইমেইলে পাঠানো লিংকে ক্লিক করে ভেরিফাই করুন, তারপর এখানে লগইন করুন।');}
  }catch(e){renderAuthScreen('register',e.message||'রেজিস্ট্রেশন ব্যর্থ হয়েছে।');}
}
async function submitLogin(){
  const email=val('a_email'),pass=val('a_pass'),url=val('a_url').trim(),key=val('a_key').trim();
  if(!email||!pass||!url||!key){alert('সব ঘর পূরণ করুন');return;}
  setSbCfg(url,key);
  try{sb=window.supabase.createClient(url,key);}
  catch(e){renderAuthScreen('login','Supabase URL/Key সঠিক নয়।');return;}
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    sbSession=data.session;await afterLogin();
  }catch(e){renderAuthScreen('login',e.message||'লগইন ব্যর্থ হয়েছে।');}
}

async function saveMember(id){
  const data={code:val('f_code'),name:val('f_name'),phone:val('f_phone'),address:val('f_addr'),role:val('f_role'),commitment:Number(val('f_commit'))||0,join_date:val('f_join'),active:document.getElementById('f_active').checked};
  if(!data.name){alert('নাম আবশ্যক');return;}
  try{
    if(id){
      const{error}=await sb.from('members').update(data).eq('id',id).eq('user_id',uidOwner());
      if(error)throw error;
      Object.assign(DB.members.find(x=>x.id===id),memberRowToObj(data));
    }else{
      const ins=await sb.from('members').insert({...data,user_id:uidOwner()}).select().single();
      if(ins.error)throw ins.error;
      DB.members.push(memberRowToObj(ins.data));
    }
    closeModal();renderApp();
  }catch(e){alert('সংরক্ষণ ব্যর্থ হয়েছে: '+(e.message||e));}
}
async function deleteMember(id){
  if(!confirm('আপনি কি নিশ্চিত এই সদস্যকে মুছে ফেলতে চান?'))return;
  try{
    const{error}=await sb.from('members').delete().eq('id',id).eq('user_id',uidOwner());
    if(error)throw error;
    DB.members=DB.members.filter(x=>x.id!==id);
    DB.subs=DB.subs.filter(x=>x.memberId!==id); // members টেবিলে ON DELETE CASCADE-এর কারণে সার্ভারেও চাঁদা মুছে যাবে
    renderApp();
  }catch(e){alert('মুছতে ব্যর্থ হয়েছে: '+(e.message||e));}
}

function printViaIframe(title,bodyHtml,extraStyles,opts){
  opts=opts||{};
  const styles=`<style>
    *{box-sizing:border-box}
    body{font-family:"Noto Sans Bengali","SolaimanLipi",sans-serif;color:#1f2d27;margin:16px}
    h2{color:#094d38;font-size:1.05rem;margin:0 0 6px}
    h3{color:#094d38;font-size:.95rem;margin:8px 0 4px}
    .card{border:1px solid #e0e6e2;border-radius:10px;padding:14px;margin-bottom:14px}
    .grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
    .stat{border:1px solid #e0e6e2;border-radius:10px;padding:10px;text-align:center}
    .stat b{display:block;font-size:1.2rem;color:#094d38}.stat span{color:#5f6f68;font-size:.8rem}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th,td{padding:5px 7px;border-bottom:1px solid #e0e6e2;text-align:right}
    thead th{background:#eef4f1;color:#094d38}.mini{font-size:.78rem;color:#5f6f68}
    @media (max-width:480px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
    ${extraStyles||''}
  </style>`;
  const fullHtml='<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>'+title+'</title>'+styles+'</head><body>'+bodyHtml+'</body></html>';
  if(window.AndroidPrint){AndroidPrint.printHtml(fullHtml,title,!!opts.landscape,!!opts.a5);return;}
  const old=document.getElementById('printFrame');
  if(old)old.remove();
  const iframe=document.createElement('iframe');
  iframe.id='printFrame';
  iframe.style.position='fixed';
  iframe.style.right='0';iframe.style.bottom='0';
  iframe.style.width='0';iframe.style.height='0';
  iframe.style.border='0';
  document.body.appendChild(iframe);
  const doc=iframe.contentWindow.document;
  doc.open();
  doc.write(fullHtml);
  doc.close();
  function doPrint(){
    try{iframe.contentWindow.focus();iframe.contentWindow.print();}
    catch(e){alert('এই ব্রাউজারে সরাসরি প্রিন্ট করা যায়নি। অনুগ্রহ করে ব্রাউজারের মেনু থেকে "শেয়ার/প্রিন্ট" অপশন ব্যবহার করুন।');}
  }
  if(iframe.contentWindow.document.readyState==='complete'){setTimeout(doPrint,150);}
  else{iframe.onload=function(){setTimeout(doPrint,150);};}
}

    return `<tr><td class="l">${toBn(i+1)}. ${m.name}</td><td>${taka(m.commitment)}</td><td>${a?taka(a):'বকেয়া'}</td><td>${p[0]?p[0].method:'—'}</td><td>${p[0]?p[0].receipt:'—'}</td></tr>`;}).join('');
  const dRows=dons.map(d=>`<tr><td class="l">${d.donorName||'নাম নেই'}</td><td>${d.category}</td><td>${taka(d.amount)}</td></tr>`).join('')||`<tr><td colspan="3">কোনো অনুদান নেই</td></tr>`;
  const eRows=exps.map(e=>`<tr><td class="l">${e.title}</td><td>${e.category}</td><td>${taka(e.amount)}</td></tr>`).join('')||`<tr><td colspan="3">কোনো ব্যয় নেই</td></tr>`;
  const n=ms.length+dons.length+exps.length;
  const fs=fitFs(n,.72,.45);
  const body=`<div class="pg">
    <div class="hd"><div><b>${DB.info.mosqueName}</b><br><span class="mini">${DB.info.address}</span></div><div style="text-align:left"><b><span class="lg">🕌</span> মাসিক হিসাব</b><br><span class="mini">${mn}, ${toBn(y)}</span></div></div>
    <h3>সদস্যভিত্তিক চাঁদা (আদায় ${taka(tS)})</h3>
    <table><thead><tr><th class="l">সদস্য</th><th>নির্ধারিত</th><th>আদায়</th><th>মাধ্যম</th><th>রশিদ</th></tr></thead><tbody>${mRows}</tbody></table>
    <h3>অনুদান (মোট ${taka(tD)})</h3><table><tbody>${dRows}</tbody></table>
    <h3>ব্যয় (মোট ${taka(tE)})</h3><table><tbody>${eRows}</tbody></table>
    <div class="net">নিট (চাঁদা + অনুদান − ব্যয়): <b>${taka(tS+tD-tE)}</b></div>
  </div>`;
  const ftrM='<div class="ftr">মুদ্রণের তারিখ: '+todayBn()+' — কম্পিউটার জেনারেটেড</div>';
  printViaIframe('মাসিক হিসাব — '+mn+' '+toBn(y),body.replace('</div>',ftrM+'</div>'),`
    @page{size:148mm 210mm;margin:4mm}
    html,body{margin:0;padding:0;overflow:hidden}
    .pg{width:140mm;height:200mm;overflow:hidden;font-size:${fs};display:flex;flex-direction:column}
    .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #c99a2e;padding-bottom:4px;margin-bottom:4px}
    .hd .lg{font-size:1.3em;margin-left:5px}
    h3{margin:5px 0 2px;font-size:${fs};color:#094d38}table{font-size:${fs}}th,td{padding:1.5px 3px;text-align:center;border:1px solid #cfd8d3}
    thead th{background:#eef4f1;color:#094d38}
    .l{text-align:right!important}.net{margin-top:5px;text-align:left}
    .ftr{margin-top:auto;padding-top:4px;border-top:1px dashed #cfd8d3;font-size:.6rem;color:#5f6f68;text-align:center}`,{a5:true});
}
function printMemberStatement(id){
  const m=DB.members.find(x=>x.id===id);if(!m)return;
  const y=CUR_YEAR,subs=memberYearSubs(id,y);
  const limit=(y===now.getFullYear())?now.getMonth()+1:12;
  let paid=0,dueCnt=0;
  const rows=MONTHS.map((mn,k)=>{const p=subs.filter(s=>s.month===k+1);const a=p.reduce((x,z)=>x+z.amount,0);paid+=a;
    const due=!a&&k+1<=limit;if(due)dueCnt++;
    return `<tr><td class="l">${mn}</td><td>${a?taka(a):(due?'বকেয়া':'—')}</td><td>${p[0]?p[0].date:'—'}</td><td>${p[0]?p[0].method:'—'}</td><td>${p[0]?p[0].receipt:'—'}</td></tr>`;}).join('');
  const body=`<div class="pg">
    <div class="hd"><div><b>${DB.info.mosqueName}</b><br><span class="mini">${DB.info.address}</span></div><div style="text-align:left"><b><span class="lg">🕌</span> সদস্য চাঁদার হিসাব</b><br><span class="mini">${toBn(y)} সাল</span></div></div>
    <table class="info"><tr><td class="l">নাম: <b>${m.name}</b></td><td class="l">কোড: ${m.code}</td></tr>
    <tr><td class="l">পদবি: ${m.role}</td><td class="l">ফোন: ${m.phone}</td></tr>
    <tr><td class="l">ঠিকানা: ${m.address}</td><td class="l">যোগদান: ${m.joinDate}</td></tr>
    <tr><td class="l">মাসিক চাঁদা: ${taka(m.commitment)}</td><td class="l">মোট আদায়: <b>${taka(paid)}</b></td></tr></table>
    <table><thead><tr><th class="l">মাস</th><th>পরিমাণ</th><th>তারিখ</th><th>মাধ্যম</th><th>রশিদ</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="net">বকেয়া মাস: <b>${toBn(dueCnt)}</b> টি — বকেয়া টাকা: <b>${taka(dueCnt*m.commitment)}</b></div>
  </div>`;
  const ftrS='<div class="ftr">মুদ্রণের তারিখ: '+todayBn()+' — কম্পিউটার জেনারেটেড</div>';
  printViaIframe('সদস্য হিসাব — '+m.name,body.replace('</div>',ftrS+'</div>'),`
    @page{size:148mm 210mm;margin:4mm}
    html,body{margin:0;padding:0;overflow:hidden}
    .pg{width:140mm;height:200mm;overflow:hidden;font-size:.8rem;display:flex;flex-direction:column}
    .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #c99a2e;padding-bottom:4px;margin-bottom:6px}
    .hd .lg{font-size:1.3em;margin-left:5px}
    table{margin-bottom:8px}th,td{padding:3px 4px;text-align:center;border:1px solid #cfd8d3}
    thead th{background:#eef4f1;color:#094d38}
    .l{text-align:right!important}.net{text-align:left}
    .ftr{margin-top:auto;padding-top:4px;border-top:1px dashed #cfd8d3;font-size:.6rem;color:#5f6f68;text-align:center}`,{a5:true});
}

  const el=document.getElementById('app');
  if(currentTab==='dashboard')el.innerHTML=viewDashboard();

}
